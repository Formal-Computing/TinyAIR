[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyair-vc"
version = "0.1.0"
description = "Small functional language with verification conditions and Z3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.13"]

[project.scripts]
tinyair = "tinyair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
